# Swissman build configuration. Sourced by every build script.

# Linux From Scratch book whose package list and checksums we follow.
# Since 13.0 only the systemd edition of the book is maintained.
LFS_BOOK=13.1-systemd
LFS_WGET_LIST=wget-list-systemd

# Kernel: we track a long-term support series instead of the version the
# LFS book ships, because LTS kernels keep receiving security fixes.
KERNEL_VERSION=6.18.57
KERNEL_URL=https://cdn.kernel.org/pub/linux/kernel/v6.x
# Stable-tree maintainers whose signatures we accept on kernel tarballs
# (fingerprints from https://www.kernel.org/signature.html).
KERNEL_SIGNERS="gregkh@kernel.org:647F28654894E3BD457199BE38DBBDC86092693E sashal@kernel.org:E27E5D8A3403A2EF66873BBCDEA66FF797772CDC"

# Cross-compilation target triple for the temporary toolchain.
SWISSMAN_TGT=x86_64-swissman-linux-gnu

# Root of the system being built. Must be an absolute path because
# the toolchain hard-codes it.
LFS=/mnt/lfs

# Where downloaded source tarballs live (relative to the repo root).
SOURCES_DIR=sources

# Minimum kernel version glibc is built to support.
GLIBC_MIN_KERNEL=5.10
