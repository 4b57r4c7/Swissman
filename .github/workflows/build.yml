name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LFS: /mnt/lfs

jobs:
  sources:
    name: Fetch and verify sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore source cache
        id: cache
        uses: actions/cache@v4
        with:
          path: sources
          key: sources-${{ hashFiles('config/build.conf') }}

      - name: Download sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/fetch-sources.sh

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: source-checksums
          path: |
            sources/md5sums
            sources/SHA256SUMS

  stage1:
    name: Stage 1 - cross toolchain
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore stage 1 cache
        id: stage1-cache
        uses: actions/cache@v4
        with:
          path: out/stage1.tar.zst*
          key: stage1-${{ hashFiles('config/build.conf', 'scripts/lib.sh', 'scripts/build-stage1.sh', 'scripts/stage1/**') }}

      - name: Restore sources
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: sources-${{ hashFiles('config/build.conf') }}
          fail-on-cache-miss: true

      - name: Install host packages
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison gawk m4 texinfo python3 xz-utils zstd
          # LFS expects /bin/sh to be bash.
          sudo ln -sf bash /usr/bin/sh

      - name: Check host
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: scripts/host-check.sh

      - name: Prepare $LFS
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p "$LFS"
          sudo chown "$(id -u):$(id -g)" "$LFS"

      - name: Build cross toolchain
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: scripts/build-stage1.sh

      - name: Pack stage 1
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: scripts/pack-stage.sh stage1

      - name: Upload stage 1
        uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: out/stage1.tar.zst*
          retention-days: 14

  stage2:
    name: Stage 2 - temporary tools
    needs: stage1
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore stage 2 cache
        id: stage2-cache
        uses: actions/cache@v4
        with:
          path: out/stage2.tar.zst*
          # Only the scripts this stage depends on, so later stages can change
          # without rebuilding it.
          key: stage2-${{ hashFiles('config/build.conf', 'scripts/lib.sh', 'scripts/build-stage1.sh', 'scripts/stage1/**', 'scripts/build-stage2.sh', 'scripts/run-steps.sh', 'scripts/chroot-build.sh', 'scripts/unpack-stage.sh', 'scripts/pack-stage.sh', 'scripts/stage2/**', 'scripts/stage2-chroot/**') }}

      - name: Download stage 1
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage1
          path: out

      - name: Restore sources
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: sources-${{ hashFiles('config/build.conf') }}
          fail-on-cache-miss: true

      - name: Free disk space
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install host packages
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison gawk m4 texinfo python3 xz-utils zstd
          sudo ln -sf bash /usr/bin/sh

      - name: Restore stage 1 into $LFS
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p "$LFS"
          sudo chown "$(id -u):$(id -g)" "$LFS"
          scripts/unpack-stage.sh stage1

      - name: Cross-compile temporary tools
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: scripts/build-stage2.sh

      - name: Build remaining tools in chroot
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: sudo scripts/chroot-build.sh scripts/stage2-chroot

      - name: Pack stage 2
        if: steps.stage2-cache.outputs.cache-hit != 'true'
        run: sudo scripts/pack-stage.sh stage2

      - name: Upload stage 2
        uses: actions/upload-artifact@v4
        with:
          name: stage2
          path: out/stage2.tar.zst*
          retention-days: 14

  stage3:
    name: Stage 3 - base system
    needs: stage2
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore stage 3 cache
        id: stage3-cache
        uses: actions/cache@v4
        with:
          path: out/stage3.tar.zst*
          key: stage3-${{ hashFiles('config/build.conf', 'scripts/lib.sh', 'scripts/build-stage1.sh', 'scripts/stage1/**', 'scripts/build-stage2.sh', 'scripts/run-steps.sh', 'scripts/chroot-build.sh', 'scripts/unpack-stage.sh', 'scripts/pack-stage.sh', 'scripts/stage2/**', 'scripts/stage2-chroot/**', 'scripts/stage3-chroot/**') }}

      - name: Download stage 2
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage2
          path: out

      - name: Restore sources
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: sources-${{ hashFiles('config/build.conf') }}
          fail-on-cache-miss: true

      - name: Free disk space
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Restore stage 2 into $LFS
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        run: sudo scripts/unpack-stage.sh stage2

      - name: Build the base system in chroot
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        run: sudo scripts/chroot-build.sh scripts/stage3-chroot

      - name: Pack stage 3
        if: steps.stage3-cache.outputs.cache-hit != 'true'
        run: sudo scripts/pack-stage.sh stage3

      - name: Upload stage 3
        uses: actions/upload-artifact@v4
        with:
          name: stage3
          path: out/stage3.tar.zst*
          retention-days: 14

  iso:
    name: Stage 4 - kernel and ISO
    needs: stage3
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set the version
        # A tag v1.2.3 builds version 1.2.3; everything else is "dev".
        run: |
          version=dev
          [[ "$GITHUB_REF" = refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          echo "SWISSMAN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore ISO cache
        id: iso-cache
        uses: actions/cache@v4
        with:
          path: |
            out/swissman.iso
            out/swissman.efi
            out/swissman.sha256
            out/secureboot/
          key: iso-${{ env.SWISSMAN_VERSION }}-${{ hashFiles('config/**', 'scripts/**', 'system/**', 'tools/make-secureboot-keys.sh') }}

      - name: Download stage 3
        if: steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: stage3
          path: out

      - name: Restore sources
        if: steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: sources-${{ hashFiles('config/build.conf') }}
          fail-on-cache-miss: true

      - name: Fetch packages from outside the LFS book
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-extra-sources.sh

      - name: Install host packages
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso mtools dosfstools zstd sbsigntool

      - name: Restore stage 3 into $LFS
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: sudo scripts/unpack-stage.sh stage3

      - name: Configure the system and build the kernel
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: sudo --preserve-env=SWISSMAN_VERSION scripts/chroot-build.sh scripts/stage4-chroot

      - name: Sign the kernel for Secure Boot
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          SECUREBOOT_DB_KEY: ${{ secrets.SECUREBOOT_DB_KEY }}
        run: sudo --preserve-env=SECUREBOOT_DB_KEY scripts/sign-kernel.sh

      - name: Build the ISO
        if: steps.iso-cache.outputs.cache-hit != 'true'
        run: sudo scripts/make-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: swissman-iso
          path: |
            out/swissman.iso
            out/swissman.efi
            out/swissman.sha256
            out/secureboot/
          retention-days: 14

  boot-test:
    name: Boot test in QEMU
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: swissman-iso
          path: out

      - name: Install QEMU, UEFI firmware and disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf \
            python3-virt-firmware cryptsetup-bin e2fsprogs fdisk squashfs-tools xorriso \
            libfido2-1 python3-fido2 python3-cryptography
          # systemd-cryptenroll comes with the runner's systemd and loads libfido2.
          # Let the runner user use KVM if the machine offers it.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot the live ISO
        run: tests/qemu-boot.py live out/swissman.iso

      - name: Boot the live ISO with Secure Boot enforced
        run: |
          tests/make-secureboot-vars.sh out/secureboot out/vars-secureboot.fd
          tests/qemu-boot.py live out/swissman.iso --secure-boot out/vars-secureboot.fd

      - name: Check that Secure Boot refuses a kernel signed by another key
        run: |
          tools/make-secureboot-keys.sh "$RUNNER_TEMP/other-keys" Other
          tests/make-secureboot-vars.sh "$RUNNER_TEMP/other-keys" out/vars-other.fd
          tests/qemu-boot.py rejected out/swissman.iso --secure-boot out/vars-other.fd --timeout 300

      - name: Boot from an encrypted disk
        run: |
          passphrase="test-$(openssl rand -hex 8)"
          uuid="$(sudo tests/make-encrypted-disk.sh out/swissman.iso out/disk.img "$passphrase")"
          sudo chown "$(id -u)" out/disk.img
          tests/qemu-boot.py encrypted out/swissman.efi out/disk.img "$uuid" "$passphrase"
          echo "PASSPHRASE=$passphrase" >> "$GITHUB_ENV"
          echo "LUKS_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Unlock the encrypted disk with a FIDO2 security key
        run: |
          # A software security key on the runner stands in for a real one.
          sudo modprobe uhid || {
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe uhid
          }
          sudo -b python3 tests/virtual-fido2.py --hidraw-file "$RUNNER_TEMP/hidraw"
          for _ in $(seq 30); do [ -s "$RUNNER_TEMP/hidraw" ] && break; sleep 1; done
          hidraw="$(cat "$RUNNER_TEMP/hidraw")"
          sudo chmod 666 "$hidraw"
          sudo tests/enroll-fido2.sh out/disk.img "$PASSPHRASE" "$hidraw"
          tests/qemu-boot.py fido2 out/swissman.efi out/disk.img "$LUKS_UUID" "$PASSPHRASE" "$hidraw"
          echo "HIDRAW=$hidraw" >> "$GITHUB_ENV"

      - name: Install, then boot, update and roll back with Secure Boot
        run: |
          rm -f out/disk.img
          truncate -s 12G out/install.img
          # A release signed by a test key, and the same one signed by a key
          # the installed system does not trust.
          keys="$RUNNER_TEMP/update-keys"
          mkdir -p "$keys"
          for name in test other; do
            openssl genpkey -algorithm ed25519 -out "$keys/$name.key"
            openssl pkey -in "$keys/$name.key" -pubout -out "$keys/$name.pem"
          done
          tools/make-release.sh out/swissman.iso 999.0.0 out/update/good
          rm out/update/good/swissman.iso
          tools/sign-release.sh out/update/good "$keys/test.key" "$keys/test.pem"
          mkdir out/update/bad
          ln out/update/good/{MANIFEST,swissman-rootfs.sfs} out/update/bad/
          tools/sign-release.sh out/update/bad "$keys/other.key" "$keys/other.pem"
          python3 -m http.server 8000 --bind 127.0.0.1 --directory out/update > /dev/null 2>&1 &
          tests/qemu-boot.py install out/swissman.iso out/install.img "$HIDRAW" \
            http://10.0.2.2:8000 "$keys/test.pem"

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: out/boot-*.log

  release:
    name: Publish the release
    needs: [iso, boot-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the update signing key
        run: |
          [ -f config/update-signing.pem ] || {
            echo "::error::Releases need config/update-signing.pem; see docs/updates.md"
            exit 1
          }

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: swissman-iso
          path: out

      - name: Prepare the release files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso
          tools/make-release.sh out/swissman.iso "${GITHUB_REF_NAME#v}" release

      - name: Sign the manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # Without the key in Secrets, the release stays a draft for the
          # owner to sign on their own computer (docs/updates.md).
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            key="$RUNNER_TEMP/update.key"
            ( umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key" )
            tools/sign-release.sh release "$key"
            rm -f "$key"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=--draft
          [ -f release/MANIFEST.sig ] && draft=
          gh release create "$GITHUB_REF_NAME" $draft --verify-tag \
            --title "Swissman ${GITHUB_REF_NAME#v}" --generate-notes release/*
